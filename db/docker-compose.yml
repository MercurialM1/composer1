
services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - APP1

  mailhog:
      image: mailhog/mailhog
      container_name: f_app_mailhog
      ports:
          - "1025:1025"
          - "8025:8025"
      networks:
          - APP1

volumes:
  pg_data:

networks:
  APP1:
    external: true



